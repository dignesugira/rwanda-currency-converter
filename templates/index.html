<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rwanda Currency Converter</title>
    <link rel="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <h1>Exchange rates for 1 RWF</h1>
    {% if error %}
    <p style="color: red;">{{error}}</p>
    {% else %}
    <form method ="get">
        <input name = "search" placeholder="search code, ex: KES" value="{{search}}">
        <select name="region">
            <option value="all">All currencies</option>
            <option value="east" {%if region =="east" %}selected{% endif %}>East Africa</option>

        </select>
        <select name="sort">
            <option value="code">Sort by code</option>
            <option value="rate" {% if sort =="rate" %}selected{% endif %}>Sort by rate</option>
            </select>
            <button type="submit">Apply</button>
            
    </form>
 
    <p>{{ results|length }} currencies found</p>

    {%if results%}
    <table border="1">
        <tr>
            <th>Currency</th>
            <th>Rate</th>
        </tr>
        {% for code, rate in results%}
        <tr>
            <td>{{code}}</td>
            <td>{{rate}}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No currency match "{{search}}". Try a code like USD OR UGX</p>
    {% endif %}
    {% endif %}
</body>
</html>
